<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf8">
  <meta name="robots" content="noindex, nofollow">
  <title>Chapter 11</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23151110'/%3E%3Cpath d='M18 44 32 16l14 28' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>
    // Set before first paint: JS flag + saved reading preferences (no flash).
    (function () {
      var d = document.documentElement;
      d.classList.add('js');
      try {
        var t = localStorage.getItem('c198:theme');
        if (t === 'night' || t === 'light') d.setAttribute('data-theme', t);
        var s = parseFloat(localStorage.getItem('c198:lt'));
        if (s > 0.5 && s < 2) d.style.setProperty('--lt', s);
      } catch (e) {}
    })();
  </script>
</head>
<body class="is-gated">

  <!-- slight hand-drawn wobble for the "shaky" balloon -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <header class="bar" id="bar">
    <div class="bar__progress" aria-hidden="true"><i id="progress"></i></div>
    <span class="bar__title" id="barTitle">Andu × Yukie · 198</span>
    <div class="bar__tools">
      <button class="tool" id="music" type="button" aria-pressed="false" aria-label="Background music" title="Background music" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <rect class="eq eq1" x="4.2"  y="5" width="2.6" height="14" rx="1.3"/>
          <rect class="eq eq2" x="9.1"  y="5" width="2.6" height="14" rx="1.3"/>
          <rect class="eq eq3" x="14"   y="5" width="2.6" height="14" rx="1.3"/>
          <rect class="eq eq4" x="18.9" y="5" width="2.6" height="14" rx="1.3"/>
          <path class="eq-slash" d="M4 21 20 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="tool" id="menuBtn" type="button" aria-expanded="false" aria-controls="menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="menu" id="menu" hidden>
    <button class="menu__row" id="nightBtn" type="button" role="switch" aria-checked="false">
      <span>Night mode</span><i class="switch" aria-hidden="true"></i>
    </button>
    <div class="menu__row" role="group" aria-label="Lettering size">
      <span>Lettering size</span>
      <span class="menu__steps">
        <button type="button" id="ltDown" aria-label="Smaller lettering">A−</button>
        <button type="button" id="ltUp" aria-label="Larger lettering">A+</button>
      </span>
    </div>
    <button class="menu__row" id="againBtn" type="button"><span>Read again</span></button>
  </div>

  <section class="cover" id="cover" aria-labelledby="coverTitle">
    <h1 class="cover__names" id="coverTitle">Andu × Yukie</h1>
    <p class="cover__chapter" id="coverChapter">Chapter 198</p>
    <button class="begin" id="begin" type="button">Begin</button>
  </section>

  <main class="reader" id="reader" aria-label="Chapter 198"></main>

  <noscript><p class="noscript">This chapter needs JavaScript switched on to play.</p></noscript>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
